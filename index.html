<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[PRML] Primal</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Floating Fullscreen Toggle Button */
    #fullscreen-btn {
      position: fixed;
      bottom: 15px;
      right: 15px;
      z-index: 999999;
      background: rgba(30, 61, 89, 0.9);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    #fullscreen-btn:hover {
      background: #1e3d59;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Fullscreen Button -->
    <button id="fullscreen-btn">🖥️ Fullscreen</button>
  
  <!-- Optional: Mobile Fallback link inside body for users hitting Google Multi-Account issues -->
    <div id="mobile-notice" style="display:none; position:fixed; top:10px; left:10px; z-index:999; background:rgba(0,0,0,0.8); color:white; padding:10px; border-radius:8px; font-size:12px;">
      Having trouble loading? <a href="https://script.google.com/macros/s/AKfycbwdBsMUWhE1Smq3uoVONcbqhC6d_aDDHmGxo3mZMR4QBoY6lyxdFm6Dh9jM__EjSnovgg/exec" target="_blank" style="color:#ff9100;">Open Direct App</a>
    </div>
  <!-- Google Apps Script Web App Embed -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbwdBsMUWhE1Smq3uoVONcbqhC6d_aDDHmGxo3mZMR4QBoY6lyxdFm6Dh9jM__EjSnovgg/exec"
    allow="fullscreen; geolocation; microphone; camera"
    sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
  </iframe>

  <script>
    const fsBtn = document.getElementById('fullscreen-btn');

    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          fsBtn.textContent = '❌ Exit Fullscreen';
        }).catch(err => {
          console.error(`Error entering full-screen mode: ${err.message}`);
        });
      } else {
        document.exitFullscreen().then(() => {
          fsBtn.textContent = '🖥️ Fullscreen';
        });
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        fsBtn.textContent = '🖥️ Fullscreen';
      }
    });
  </script>
</body>
</html>
